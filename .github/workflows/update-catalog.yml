name: Build movie database

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rich TMDB catalog
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          test -n "$TMDB_TOKEN" || (echo "TMDB_TOKEN secret is missing" && exit 1)
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, time

          TOKEN=os.environ["TMDB_TOKEN"]
          BASE="https://api.themoviedb.org/3"
          HEAD={"Authorization":f"Bearer {TOKEN}","accept":"application/json"}
          def get(path, params):
              url=BASE+path+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=HEAD)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          items=[]
          seen=set()
          for endpoint,typ in [("/trending/movie/day","movie"),("/trending/tv/day","series"),("/movie/popular","movie"),("/tv/popular","series"),("/movie/top_rated","movie"),("/tv/top_rated","series")]:
              for page_no in range(1,11):
                  page=get(endpoint,{"language":"fa-IR","page":page_no})
                  for x in page.get("results",[])[:40]:
                      if x.get("id") in seen: continue
                      seen.add(x["id"])
                      items.append((x["id"],typ))

          out=[]
          for i,(tid,typ) in enumerate(items):
              try:
                  path=f"/movie/{tid}" if typ=="movie" else f"/tv/{tid}"
                  d=get(path,{"language":"fa-IR","append_to_response":"credits,videos"})
                  title=d.get("title") or d.get("name") or d.get("original_title") or d.get("original_name") or ""
                  original=d.get("original_title") or d.get("original_name") or ""
                  date=d.get("release_date") or d.get("first_air_date") or ""
                  cast=[]
                  for p in (d.get("credits") or {}).get("cast",[])[:8]:
                      if p.get("name"):
                          cast.append({"name":p["name"],"character":p.get("character",""),"photo":("https://image.tmdb.org/t/p/w185"+p["profile_path"]) if p.get("profile_path") else ""})
                  trailer=""
                  for v in (d.get("videos") or {}).get("results",[]):
                      if v.get("site")=="YouTube" and v.get("type")=="Trailer":
                          trailer=v.get("key",""); break
                  genres=[g.get("name") for g in d.get("genres",[]) if g.get("name")]
                  item={
                    "id":d.get("id"),"type":typ,"title":original,"fa":title,
                    "year":int(date[:4]) if date[:4].isdigit() else None,
                    "genres":genres,"rating":round(float(d.get("vote_average") or 0),1),
                    "poster":("https://image.tmdb.org/t/p/w500"+d["poster_path"]) if d.get("poster_path") else "",
                    "backdrop":("https://image.tmdb.org/t/p/w1280"+d["backdrop_path"]) if d.get("backdrop_path") else "",
                    "overview":d.get("overview") or "",
                    "runtime":d.get("runtime"),
                    "episodes":d.get("number_of_episodes"),
                    "seasons":d.get("number_of_seasons"),
                    "status":d.get("status") or "",
                    "cast":cast,"trailer":trailer,
                    "tmdb_url":"https://www.themoviedb.org/"+("movie/" if typ=="movie" else "tv/")+str(tid),
                    "watch":{}
                  }
                  try:
                      wp=get(f"/movie/{tid}/watch/providers" if typ=="movie" else f"/tv/{tid}/watch/providers",{})
                      regions={}
                      for rc in ("AZ","US","TR","GB","CA","DE"):
                          rr=wp.get("results",{}).get(rc,{})
                          if rr:
                              regions[rc]={"link":rr.get("link",""),"flatrate":rr.get("flatrate",[]),"free":rr.get("free",[]),"ads":rr.get("ads",[]),"rent":rr.get("rent",[]),"buy":rr.get("buy",[])}
                      item["watch"]=regions
                  except Exception as e:
                      print(f"providers skip {typ}/{tid}: {e}")
                  out.append(item)
              except Exception as e:
                  print(f"skip {typ}/{tid}: {e}")
              time.sleep(0.06)

          # Add a separate legal/free catalog from Internet Archive public-domain items.
          # These are embedded through Archive's own player; no files are copied to GitHub.
          try:
              q=urllib.parse.quote('mediatype:movies AND licenseurl:("https://creativecommons.org/publicdomain" OR "http://creativecommons.org/publicdomain")')
              ia_url=f"https://archive.org/advancedsearch.php?q={q}&fl[]=identifier&fl[]=title&fl[]=year&fl[]=description&rows=100&page=1&output=json"
              with urllib.request.urlopen(ia_url,timeout=30) as r:
                  ia=json.load(r)
              for n,x in enumerate(ia.get("response",{}).get("docs",[])):
                  ident=x.get("identifier"); title=x.get("title") or ident
                  if not ident: continue
                  out.append({
                    "id":"ia-"+ident,"type":"movie","title":title,"fa":title,
                    "year":int(str(x.get("year"))[:4]) if str(x.get("year",""))[:4].isdigit() else None,
                    "genres":["کلاسیک / مالکیت عمومی"],"rating":0,
                    "poster":f"https://archive.org/services/img/{ident}",
                    "backdrop":f"https://archive.org/services/img/{ident}",
                    "overview":str(x.get("description") or "فیلم رایگان با اعلام مالکیت عمومی در Internet Archive.")[:1200],
                    "embed_url":f"https://archive.org/embed/{urllib.parse.quote(ident)}",
                    "source_label":"Internet Archive — Public Domain"
                  })
              print("Added Internet Archive legal items")
          except Exception as e:
              print(f"Internet Archive catalog skip: {e}")

          out.sort(key=lambda x:x.get("rating",0),reverse=True)
          json.dump(out,open("catalog.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(f"Built {len(out)} rich titles from {len(items)} candidates")
          PY

      - name: Commit catalog
        run: |
          git config user.name "nabz-film-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "Update rich TMDB catalog"
          git push
