name: Build movie database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog, title pages and sitemap
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/build_catalog.py --out .
      - name: Commit catalog
        run: |
          git config user.name "nabz-film-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data t sitemap.xml
          git diff --cached --quiet || git commit -m "Update catalog v2"
          git pull --rebase origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
